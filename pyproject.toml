[project]
name = "riskguard-adapter"
version = "0.1.0"
description = "Guardrails and evidence for autonomous BNB agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "bnbagent>=0.3.4",
    "eth-account>=0.13.7",
    "uagents>=0.25.2",
]

[project.scripts]
riskguard = "riskguard_adapter.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskguard_adapter"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
